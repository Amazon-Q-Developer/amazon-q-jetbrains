name: Qodana - Duplicated Code

on:
  workflow_dispatch:
  push:
    # Only main: for a branch with an open PR, the pull_request run already does this full scan (pr-mode: false).
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ${{ github.workflow }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # PR check
      checks: write
      # PR comments
      pull-requests: write
      # SARIF upload
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Maximize Build Space
        if: runner.os == 'Linux'
        # Removes what jlumbroso/free-disk-space removed when this step passed it
        # tool-cache: false and large-packages: false: the Android SDK, .NET, Haskell and Docker images.
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          df -h /
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.1.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # --config points to the DuplicatedCode-only Qodana config
          args:
            --config,qodana-configs/duplicated-code/qodana.yaml
          cache-default-branch-only: true
          # pr-mode off means that the whole repo should be checked for duplicate code, instead of just copy/pastes within the PR
          pr-mode: false
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
