name: Windows Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feature/*, fix/*, test/* ]

permissions:
  contents: read

jobs:
  windows-unit-tests:
    name: Windows (${{ matrix.ideProfileName }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ideProfileName: [ "2025.3", "2026.1", "2026.2" ]
    env:
      CI: true
      LOCAL_ENV_RUN: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          # Install both: 251-261 profiles target JDK 21, 2026.2 targets JDK 25. The Gradle toolchain (see
          # toolkit-jvm-conventions.gradle.kts) selects the right one per profile, so CI never picks a JDK itself.
          # 21 is listed last so it becomes JAVA_HOME and launches Gradle; 25 is forked to only for 2026.2.
          java-version: |
            25
            21
          distribution: 'corretto'
          cache: 'gradle'

      - name: Configure Gradle properties
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.gradle" | Out-Null
          @"
          org.gradle.jvmargs=-Xmx4g
          kotlin.daemon.jvmargs=-Xmx4g
          # let the Gradle toolchain discover the JDKs setup-java installed (it doesn't auto-detect these paths)
          org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
          "@ | Add-Content -Path "$env:USERPROFILE\.gradle\gradle.properties"

      - name: Run tests
        # 2026.2 unit tests have known pre-existing failures: the 262 platform changed how plugin extension points
        # and services register in tests (~280 "Missing extension point" / "Cannot find service"). The same tests
        # pass on 2026.1, so this is a 262 test-infra migration, tracked separately. Until that lands, 262 tests run
        # and report but don't gate; the buildPlugin step below gates 262 on a real compile. 251-261 gate fully.
        continue-on-error: ${{ matrix.ideProfileName == '2026.2' }}
        # --no-parallel: amazonq submodules share one test sandbox; concurrent Test tasks corrupt the index (fatal on Gradle 9)
        run: ./gradlew -PideProfileName="${{ matrix.ideProfileName }}" check coverageReport --no-parallel --stacktrace --console plain --continue

      - name: Build plugin (2026.2 gate)
        # 262 tests are non-gating above, so gate the 262 job on a real buildPlugin compile instead
        if: matrix.ideProfileName == '2026.2'
        run: ./gradlew -PideProfileName="${{ matrix.ideProfileName }}" buildPlugin --no-parallel --stacktrace --console plain

      - name: Collect test artifacts
        if: always()
        shell: pwsh
        run: |
          $TEST_ARTIFACTS = Join-Path $env:TEMP "testArtifacts"
          $TEST_REPORTS = Join-Path $TEST_ARTIFACTS "test-reports"
          New-Item -ItemType Directory -Force -Path $TEST_REPORTS | Out-Null

          function Copy-Artifacts($filter, $destdir) {
            Get-ChildItem -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -Like "$filter" } |
              ForEach-Object {
                $relativePath = Resolve-Path -Relative $_.FullName
                $dest = Join-Path $destdir $relativePath
                Copy-Item -Path $_.FullName -Destination $dest -Recurse -Container -ErrorAction SilentlyContinue
              }
          }

          Copy-Artifacts "*\build\idea-sandbox\*\log*" $TEST_ARTIFACTS
          Copy-Artifacts "*\build\reports" $TEST_ARTIFACTS
          Copy-Artifacts "*\test-results" $TEST_REPORTS

          echo "TEST_ARTIFACTS=$TEST_ARTIFACTS" >> $env:GITHUB_ENV

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-artifacts-${{ matrix.ideProfileName }}
          path: ${{ env.TEST_ARTIFACTS }}
          retention-days: 14
